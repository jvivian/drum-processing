name: CI

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # Python version comes from environment-dev.yml (3.12, required by pyproject);
      # the env file also pip-installs the package with `-e ".[dev]"`.
      - name: Setup Miniconda
        uses: conda-incubator/setup-miniconda@v4
        with:
          environment-file: environment-dev.yml
          activate-environment: drumprep-dev
          conda-remove-defaults: true

      - name: Conda info
        shell: bash -l {0}
        run: |
          conda info
          conda list

      - name: Lint with ruff
        shell: bash -l {0}
        run: |
          ruff check drum_processing/ tests/

      - name: Test with pytest
        shell: bash -l {0}
        run: |
          pytest tests/ -v --cov=drum_processing --cov-report=xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.xml
          flags: unittests
          name: codecov-umbrella
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  build:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build package
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
